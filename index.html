<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Princesita</title>
    <style>
        :root {
            --bg-color: #fdf2e9;
            --pink-light: #f8bbd0;
            --pink-main: #f48fb1;
            --pink-dark: #e91e63;
        }

        body {
            background-color: var(--bg-color);
            color: #5d4037;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- FONDO GLOBAL ANIMADO (Desde el inicio) --- */
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; 
        }

        .bg-item {
            position: absolute;
            animation: moveRight linear infinite;
            opacity: 0.5;
            user-select: none;
        }

        @keyframes moveRight {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 100px)); }
        }

        /* --- PANTALLA DEL SOBRE --- */
        #envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease, visibility 1s;
        }

        .envelope-wrapper {
            position: relative;
            width: 280px;
            height: 200px;
            cursor: pointer;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.1));
            z-index: 101;
        }

        .envelope-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: var(--pink-light);
            border-radius: 0 0 15px 15px;
            z-index: 1;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid var(--pink-main);
            z-index: 3;
            transition: transform 0.5s ease;
            transform-origin: top;
        }

        .heart-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -10%);
            font-size: 60px;
            color: var(--pink-dark);
            z-index: 4;
            animation: pulse 1.5s infinite;
        }

        .open-btn-text {
            margin-top: 40px;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--pink-dark);
            letter-spacing: 5px;
            z-index: 101;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -10%) scale(1); }
            50% { transform: translate(-50%, -10%) scale(1.15); }
        }

        /* --- CONTENIDO DEL ÁRBOL --- */
        #main-content {
            opacity: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s ease;
        }

        .tree-container {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .trunk {
            width: 14px;
            height: 160px;
            background-color: #5d4037;
            border-radius: 5px;
            z-index: 2;
        }

        .hearts-copa {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 400px;
            z-index: 3;
        }

        .heart-particle {
            position: absolute;
            font-size: 16px;
            transform: translate(-50%, -50%);
            animation: floatTreeHeart linear infinite;
        }

        @keyframes floatTreeHeart {
            0% { transform: translate(-50%, -50%) translateY(0) rotate(0); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) translateY(-15px) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-40px) rotate(-5deg); opacity: 0; }
        }

        .timer-box {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 15px 30px;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            z-index: 10;
        }

        .time-display {
            font-size: 1.6rem;
            color: var(--pink-dark);
            font-weight: bold;
        }

        .quote-text {
            max-width: 340px;
            text-align: center;
            font-style: italic;
            line-height: 1.5;
            padding: 0 15px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="background-elements" id="bgElements"></div>

    <div id="envelope-screen">
        <div class="envelope-wrapper" onclick="openGift()">
            <div class="envelope-base"></div>
            <div class="envelope-flap"></div>
            <div class="heart-seal">♥</div>
        </div>
        <div class="open-btn-text">ABRIR</div>
    </div>

    <div id="main-content">
        <div class="tree-container">
            <div class="trunk"></div>
            <div id="heartsContainer" class="hearts-copa"></div>
        </div>
        <div class="timer-box">
            <div style="font-size: 1.1rem; margin-bottom: 5px;">Nuestro amor ha crecido por:</div>
            <div id="timeCounter" class="time-display">Calculando...</div>
        </div>
        <div class="quote-text">
            Te amo mi princesita, eres lo más bonito que me ha pasado, espero poder compartir muchos años más a tu lado♡
        </div>
    </div>

    <script>
        // Generar Nubes y Corazones de fondo (Persistentes)
        function createBackground() {
            const bg = document.getElementById('bgElements');
            const icons = ['☁', '♥', '☁', '❤'];
            
            for (let i = 0; i < 20; i++) {
                const item = document.createElement('div');
                item.className = 'bg-item';
                item.innerText = icons[Math.floor(Math.random() * icons.length)];
                
                const size = 15 + Math.random() * 35;
                item.style.fontSize = `${size}px`;
                item.style.top = `${Math.random() * 100}vh`;
                
                const duration = 12 + Math.random() * 22;
                const delay = Math.random() * -35; // Para que ya estén en pantalla al cargar
                
                item.style.animationDuration = `${duration}s`;
                item.style.animationDelay = `${delay}s`;
                item.style.color = item.innerText === '☁' ? 'white' : '#f48fb1';
                
                bg.appendChild(item);
            }
        }

        function openGift() {
            // Animación de apertura
            document.querySelector('.envelope-flap').style.transform = 'rotateX(160deg)';
            
            setTimeout(() => {
                document.getElementById('envelope-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('envelope-screen').style.display = 'none';
                    const main = document.getElementById('main-content');
                    main.style.display = 'flex';
                    setTimeout(() => main.style.opacity = '1', 50);
                    generateTree();
                }, 1000);
            }, 300);
        }

        function generateTree() {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < 500; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '♥';
                heart.style.color = '#e91e63';

                const theta = Math.random() * 2 * Math.PI;
                const baseRadius = Math.sqrt(Math.random());
                const variation = 0.85 + (Math.random() * 0.3);
                
                const x = (container.offsetWidth / 2) + (baseRadius * 195 * variation * Math.cos(theta));
                const y = 180 + (baseRadius * 175 * variation * Math.sin(theta));

                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                heart.style.animationDuration = `${7 + Math.random() * 5}s`;
                heart.style.animationDelay = `${Math.random() * -20}s`;
                heart.style.opacity = 0.4 + Math.random() * 0.6;
                container.appendChild(heart);
            }
        }

        // FECHA: 18 de marzo de 2025
        const startTime = new Date(2025, 2, 18);
        function updateCounter() {
            const now = new Date();
            const diff = now - startTime;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timeCounter').innerText = `${d} días, ${h}h ${m}m ${s}s`;
        }

        // Iniciamos todo
        createBackground();
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
