<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol de Corazones Masivos</title>
    <style>
        /* Estilo base (mantenemos el color de fondo y el tipo de letra) */
        body {
            background-color: #fdf2e9;
            color: #5d4037;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Para que los corazones no hagan scroll */
        }

        /* Contenedor principal del árbol */
        .tree-container {
            position: relative;
            width: 300px;
            height: 350px;
            margin-bottom: 20px;
        }

        /* El tronco café (recuperado) */
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 15px; /* Más ancho para que se note */
            height: 200px;
            background-color: #5d4037; /* Café oscuro */
            border-radius: 5px;
            transform: translateX(-50%);
        }
