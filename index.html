<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol de Amor Estable</title>
    <style>
        body {
            background-color: #fdf2e9;
            color: #5d4037;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden; /* Importante para que no haya scroll en celular */
        }

        /* --- CONTENEDOR CENTRAL DEL ÁRBOL (ESTO ARREGLA EL PROBLEMA) --- */
        .tree-stage {
            position: relative;
            width: 320px; /* Ancho fijo para garantizar que todo esté centrado */
            height: 400px; /* Altura suficiente para tronco y copa */
            margin-bottom: 5px;
            display: flex;
            justify-content: center; /* Centra el tronco horizontalmente */
            align-items: flex-end; /* Pone el tronco en la base */
        }

        .trunk {
            position: absolute;
            bottom: 0px;
            width: 14px;
            height: 140px;
            background-color: #5d4037;
            border-radius: 5px;
            z-index: 1; /* El tronco va detrás */
        }

        /* Contenedor invisible para la copa, atado al centro del Stage */
        .hearts-copa {
            position: absolute;
            bottom: 60px; /* Donde empieza la copa sobre el tronco */
            width: 100%; /* Ocupa todo el stage */
            height: 380px; /* Copa grande y amplia */
            z-index: 2; /* Los corazones van delante */
        }

        .heart-particle {
            position: absolute;
            font-size: 16px; /* Tamaño del corazón real */
            transform: translate(-50%, -50%);
            animation: floatHeart linear infinite;
        }

        @keyframes floatHeart {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) translateY(-25px) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-60px) rotate(-5deg); opacity: 0; }
        }

        .header-text {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .timer-box {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 12px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .time-display {
            font-size: 1.5rem;
            color: #e91e63;
            font-weight: bold;
            text-align: center;
        }

        .quote-text {
            font-size: 1.1rem;
            font-style: italic;
            color: #795548;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
            max-width: 320px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="tree-stage">
        <div class="trunk"></div>
        <div class="hearts-copa" id="heartsContainer"></div>
    </div>

    <div class="header-text">Nuestro amor ha crecido por:</div>

    <div class="timer-box">
        <div class="time-display" id="timeCounter">Calculando...</div>
    </div>

    <div class="quote-text">
        Te amo mi princesita, eres lo más bonito que me ha pasado, espero poder compartir muchos años más a tu lado♡
    </div>

    <script>
        const container = document.getElementById('heartsContainer');
        const numHearts = 500; // Solo 500 corazones como pediste

        const colorRosa = '#e91e63'; // Solo color rosa

        for (let i = 0; i < numHearts; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '♥'; // Corazón real
            
            // --- CÁLCULO DE POSICIÓN ESTABLE (DENTRO DEL COPA CONTAINER) ---
            const centerX = container.offsetWidth / 2; // El centro es la mitad del Copa container
            const centerY = 190; // El centro de la copa ovalada
            
            const theta = Math.random() * 2 * Math.PI;
            
            // Radios ampliados para volumen, pero dentro del Copa container
            const radiusX = Math.random() * 155; // Copa frondosa y amplia
            const radiusY = Math.random() * 145; // Copa redondeada
            
            // Posición relativa al centro del stage
            const x = centerX + radiusX * Math.cos(theta);
            const y = centerY + radiusY * Math.sin(theta);

            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;

            // Todos los corazones son rosas
            heart.style.color = colorRosa;

            // Variaciones aleatorias para movimiento natural
            const delay = Math.random() * 20; 
            const duration = 8 + Math.random() * 6; 

            heart.style.animationDelay = `${-delay}s`;
            heart.style.animationDuration = `${duration}s`;
            heart.style.opacity = 0.5 + Math.random() * 0.5;

            container.appendChild(heart);
        }

        // FECHA DE INICIO: 18 de marzo de 2025
        const startTime = new Date(2025, 2, 18); // Meses son base 0 (Enero=0, Marzo=2)

        function updateCounter() {
            const now = new Date();
            const difference = now.getTime() - startTime.getTime();

            // Cálculo preciso
            const msPerDay = 1000 * 60 * 60 * 24;
            const msPerHour = 1000 * 60 * 60;
            const msPerMinute = 1000 * 60;
            const msPerSecond = 1000;

            let remaining = difference;

            const days = Math.floor(remaining / msPerDay);
            remaining %= msPerDay;

            const hours = Math.floor(remaining / msPerHour);
            remaining %= msPerHour;

            const minutes = Math.floor(remaining / msPerMinute);
            remaining %= msPerMinute;

            const seconds = Math.floor(remaining / msPerSecond);

            document.getElementById('timeCounter').innerHTML = 
                `${days} días, ${hours}h ${minutes}m ${seconds}s`;
        }

        setInterval(updateCounter, 1000);
        updateCounter(); 
    </script>
</body>
</html>
