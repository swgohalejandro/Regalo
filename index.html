<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un regalo para mi Princesita</title>
    <style>
        body {
            background-color: #fdf2e9;
            color: #5d4037;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* --- ESTILOS DEL SOBRE (PANTALLA INICIAL) --- */
        #envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdf2e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease, visibility 1s;
        }

        .envelope {
            width: 200px;
            height: 150px;
            background-color: #f8bbd0;
            position: relative;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tapa del sobre */
        .envelope::before {
            content: "";
            position: absolute;
            top: -75px;
            left: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 75px solid #f48fb1;
            z-index: 1;
        }

        .heart-btn {
            font-size: 50px;
            color: #e91e63;
            z-index: 2;
            transition: transform 0.3s ease;
            cursor: pointer;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
            animation: pulse 1.5s infinite;
        }

        .heart-btn:hover {
            transform: scale(1.2);
        }

        .open-text {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ad1457;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- ESTILOS DEL ÁRBOL (TU PROYECTO ACTUAL) --- */
        #main-content {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 1.5s ease;
        }

        .tree-container {
            position: relative;
            width: 100%;
            height: 420px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .trunk {
            position: absolute;
            bottom: 0px;
            width: 14px;
            height: 160px;
            background-color: #5d4037;
            border-radius: 5px;
            z-index: 1;
        }

        .hearts-copa {
            position: absolute;
            bottom: 60px; 
            width: 100%;
            height: 400px;
            z-index: 2;
        }

        .heart-particle {
            position: absolute;
            font-size: 15px;
            transform: translate(-50%, -50%);
            animation: floatHeart linear infinite;
        }

        @keyframes floatHeart {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) translateY(-15px) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-40px) rotate(-5deg); opacity: 0; }
        }

        .header-text {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .timer-box {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 12px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .time-display {
            font-size: 1.5rem;
            color: #e91e63;
            font-weight: bold;
            text-align: center;
        }

        .quote-text {
            font-size: 1.1rem;
            font-style: italic;
            color: #795548;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
            max-width: 320px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="envelope-screen">
        <div class="envelope" onclick="openGift()">
            <div class="heart-btn">♥</div>
        </div>
        <div class="open-text">ABRIR</div>
    </div>

    <div id="main-content">
        <div class="tree-container">
            <div class="trunk"></div>
            <div id="heartsContainer" class="hearts-copa"></div>
        </div>

        <div class="header-text">Nuestro amor ha crecido por:</div>

        <div class="timer-box">
            <div id="timeCounter" class="time-display">Calculando...</div>
        </div>

        <div class="quote-text">
            Te amo mi princesita, eres lo más bonito que me ha pasado, espero poder compartir muchos años más a tu lado♡
        </div>
    </div>

    <script>
        // Función para abrir el regalo
        function openGift() {
            document.getElementById('envelope-screen').style.opacity = '0';
            document.getElementById('envelope-screen').style.visibility = 'hidden';
            document.getElementById('main-content').style.opacity = '1';
            
            // Iniciar la generación de corazones cuando se abre
            generateHearts();
        }

        function generateHearts() {
            const container = document.getElementById('heartsContainer');
            const numHearts = 500;
            const colorRosa = '#e91e63';

            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-particle');
                heart.innerHTML = '♥';
                
                const centerX = container.offsetWidth / 2;
                const centerY = 180;
                
                const theta = Math.random() * 2 * Math.PI;
                const baseRadius = Math.sqrt(Math.random()); 
                const variation = 0.85 + (Math.random() * 0.3); 
                
                const radiusX = baseRadius * 195 * variation; 
                const radiusY = baseRadius * 175 * variation; 
                
                const x = centerX + radiusX * Math.cos(theta);
                const y = centerY + radiusY * Math.sin(theta);

                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                heart.style.color = colorRosa;

                const delay = Math.random() * 20; 
                const duration = 7 + Math.random() * 5; 

                heart.style.animationDelay = `${-delay}s`;
                heart.style.animationDuration = `${duration}s`;
                heart.style.opacity = 0.4 + Math.random() * 0.6;

                container.appendChild(heart);
            }
        }

        // FECHA DE INICIO: 18 de marzo de 2025
        const startTime = new Date(2025, 2, 18); 

        function updateCounter() {
            const now = new Date();
            const difference = now.getTime() - startTime.getTime();
            const msPerDay = 1000 * 60 * 60 * 24;
            const msPerHour = 1000 * 60 * 60;
            const msPerMinute = 1000 * 60;
            const msPerSecond = 1000;
            let remaining = difference;
            const days = Math.floor(remaining / msPerDay);
            remaining %= msPerDay;
            const hours = Math.floor(remaining / msPerHour);
            remaining %= msPerHour;
            const minutes = Math.floor(remaining / msPerMinute);
            remaining %= msPerMinute;
            const seconds = Math.floor(remaining / msPerSecond);
            document.getElementById('timeCounter').innerHTML = 
                `${days} días, ${hours}h ${minutes}m ${seconds}s`;
        }
        setInterval(updateCounter, 1000);
        updateCounter(); 
    </script>
</body>
</html>
